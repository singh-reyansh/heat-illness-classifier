<text x="30" y="420" font-size="12.5" fill="#10151f" font-weight="normal" text-anchor="start">Green diagonal = correct answers (49 of 50).</text>
<text x="30" y="442" font-size="12.5" fill="#7a1515" font-weight="normal" text-anchor="start">Red = the one mistake: V008 (true answer: Not Heat Illness, the classifier said: Heat Stroke).</text>
<rect x="610" y="100" width="245" height="110" rx="10" fill="#eaf2ff" stroke="#2a78d6" stroke-width="1.5"/>
<text x="732.5" y="132.0" font-size="14" fill="#123f75" font-weight="bold" text-anchor="middle">Recall (read a ROW)</text>
<text x="732.5" y="151.0" font-size="12" fill="#52514e" font-weight="normal" text-anchor="middle">Of the 17 real Heat Stroke</text>
<text x="732.5" y="168.0" font-size="12" fill="#52514e" font-weight="normal" text-anchor="middle">cases, how many did it catch?</text>
<text x="732.5" y="185.0" font-size="12" fill="#52514e" font-weight="normal" text-anchor="middle">17 / 17 = 100%</text>
<rect x="610" y="225" width="245" height="110" rx="10" fill="#f3eeff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="732.5" y="257.0" font-size="14" fill="#43207f" font-weight="bold" text-anchor="middle">Precision (read a COLUMN)</text>
<text x="732.5" y="276.0" font-size="12" fill="#52514e" font-weight="normal" text-anchor="middle">Of the 18 times it SAID Heat</text>
<text x="732.5" y="293.0" font-size="12" fill="#52514e" font-weight="normal" text-anchor="middle">Stroke, how many were right?</text>
<text x="732.5" y="310.0" font-size="12" fill="#52514e" font-weight="normal" text-anchor="middle">17 / 18 = 94%</text>
<text x="610" y="360" font-size="12" fill="#52514e" font-weight="bold" text-anchor="start">For heat stroke, recall matters most:</text>
<text x="610" y="378" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">a missed heat stroke is dangerous, a</text>
<text x="610" y="396" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">false alarm is only inconvenient.</text>
