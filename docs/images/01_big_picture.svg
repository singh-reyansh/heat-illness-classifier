<svg xmlns="http://www.w3.org/2000/svg" width="900" height="565" viewBox="0 0 900 565" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<title>The big picture</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#6b6f7b"/></marker></defs>
<rect width="900" height="565" fill="#ffffff"/>
<text x="30" y="36" font-size="20" fill="#10151f" font-weight="bold" text-anchor="start">The big picture: one classifier, two jobs</text>
<rect x="15" y="55" width="870" height="225" rx="14" fill="#f7f9fe" stroke="#d5e2f7" stroke-width="1"/>
<text x="30" y="80" font-size="13" fill="#2a78d6" font-weight="bold" text-anchor="start">1. THE EXPERIMENT: does it work?</text>
<rect x="30" y="100" width="170" height="78" rx="10" fill="#f4f4f2" stroke="#9a9a94" stroke-width="1.5"/>
<text x="115.0" y="125.0" font-size="14" fill="#3a3a37" font-weight="bold" text-anchor="middle">50 vignettes</text>
<text x="115.0" y="144.0" font-size="12" fill="#52514e" font-weight="normal" text-anchor="middle">short patient stories</text>
<text x="115.0" y="161.0" font-size="12" fill="#52514e" font-weight="normal" text-anchor="middle">with known answers</text>
<rect x="250" y="100" width="180" height="78" rx="10" fill="#fff0e6" stroke="#eb6834" stroke-width="1.5"/>
<text x="340.0" y="125.0" font-size="14" fill="#7a2e10" font-weight="bold" text-anchor="middle">AI-assisted classifier</text>
<text x="340.0" y="144.0" font-size="12" fill="#52514e" font-weight="normal" text-anchor="middle">LLM answers 2 yes/no</text>
<text x="340.0" y="161.0" font-size="12" fill="#52514e" font-weight="normal" text-anchor="middle">questions + NATA rule</text>
<rect x="480" y="100" width="170" height="78" rx="10" fill="#eaf2ff" stroke="#2a78d6" stroke-width="1.5"/>
<text x="565.0" y="125.0" font-size="14" fill="#123f75" font-weight="bold" text-anchor="middle">Results files</text>
<text x="565.0" y="144.0" font-size="12" fill="#52514e" font-weight="normal" text-anchor="middle">one predicted label</text>
<text x="565.0" y="161.0" font-size="12" fill="#52514e" font-weight="normal" text-anchor="middle">per vignette (CSV)</text>
<rect x="700" y="100" width="170" height="78" rx="10" fill="#e9f6ea" stroke="#2e8b57" stroke-width="1.5"/>
<text x="785.0" y="125.0" font-size="14" fill="#1d5a37" font-weight="bold" text-anchor="middle">Statistics</text>
<text x="785.0" y="144.0" font-size="12" fill="#52514e" font-weight="normal" text-anchor="middle">accuracy + Wilson range,</text>
<text x="785.0" y="161.0" font-size="12" fill="#52514e" font-weight="normal" text-anchor="middle">McNemar, recall, kappa</text>
<rect x="250" y="197" width="180" height="64" rx="10" fill="#f4f4f2" stroke="#9a9a94" stroke-width="1.5"/>
<text x="340.0" y="224.0" font-size="14" fill="#3a3a37" font-weight="bold" text-anchor="middle">2 baselines (no AI)</text>
<text x="340.0" y="243.0" font-size="12" fill="#52514e" font-weight="normal" text-anchor="middle">temperature only, keywords</text>
<path d="M200 139 L247 139" fill="none" stroke="#6b6f7b" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M430 139 L477 139" fill="none" stroke="#6b6f7b" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M650 139 L697 139" fill="none" stroke="#6b6f7b" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M115 178 L115 229 L247 229" fill="none" stroke="#6b6f7b" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M430 229 L565 229 L565 181" fill="none" stroke="#6b6f7b" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="15" y="300" width="870" height="250" rx="14" fill="#faf7ff" stroke="#e6ddfb" stroke-width="1"/>
<text x="30" y="325" font-size="13" fill="#7c3aed" font-weight="bold" text-anchor="start">2. THE APP: using it at the science fair</text>
<rect x="30" y="345" width="170" height="78" rx="10" fill="#f3eeff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="115.0" y="370.0" font-size="14" fill="#43207f" font-weight="bold" text-anchor="middle">Web page (HTML)</text>
<text x="115.0" y="389.0" font-size="12" fill="#52514e" font-weight="normal" text-anchor="middle">form, results, chat box,</text>
<text x="115.0" y="406.0" font-size="12" fill="#52514e" font-weight="normal" text-anchor="middle">demo mode</text>
<rect x="250" y="345" width="180" height="78" rx="10" fill="#f3eeff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="340.0" y="370.0" font-size="14" fill="#43207f" font-weight="bold" text-anchor="middle">Flask server</text>
<text x="340.0" y="389.0" font-size="12" fill="#52514e" font-weight="normal" text-anchor="middle">server.py: keeps the</text>
<text x="340.0" y="406.0" font-size="12" fill="#52514e" font-weight="normal" text-anchor="middle">API key secret</text>
<rect x="480" y="345" width="170" height="78" rx="10" fill="#fff0e6" stroke="#eb6834" stroke-width="1.5"/>
<text x="565.0" y="370.0" font-size="14" fill="#7a2e10" font-weight="bold" text-anchor="middle">AI-assisted classifier</text>
<text x="565.0" y="389.0" font-size="12" fill="#52514e" font-weight="normal" text-anchor="middle">the SAME code used</text>
<text x="565.0" y="406.0" font-size="12" fill="#52514e" font-weight="normal" text-anchor="middle">in the experiment</text>
<rect x="700" y="345" width="170" height="78" rx="10" fill="#f4f4f2" stroke="#9a9a94" stroke-width="1.5"/>
<text x="785.0" y="370.0" font-size="14" fill="#3a3a37" font-weight="bold" text-anchor="middle">Groq LLM</text>
<text x="785.0" y="389.0" font-size="12" fill="#52514e" font-weight="normal" text-anchor="middle">gpt-oss-20b,</text>
<text x="785.0" y="406.0" font-size="12" fill="#52514e" font-weight="normal" text-anchor="middle">on the internet</text>
<rect x="250" y="455" width="180" height="78" rx="10" fill="#e9f6ea" stroke="#2e8b57" stroke-width="1.5"/>
<text x="340.0" y="480.0" font-size="14" fill="#1d5a37" font-weight="bold" text-anchor="middle">Naive Bayes chatbot</text>
<text x="340.0" y="499.0" font-size="12" fill="#52514e" font-weight="normal" text-anchor="middle">trained by you, runs</text>
<text x="340.0" y="516.0" font-size="12" fill="#52514e" font-weight="normal" text-anchor="middle">offline on the laptop</text>
<path d="M203 384 L247 384" fill="none" stroke="#6b6f7b" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#a)"/>
<path d="M433 384 L477 384" fill="none" stroke="#6b6f7b" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#a)"/>
<path d="M653 384 L697 384" fill="none" stroke="#6b6f7b" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#a)"/>
<path d="M340 426 L340 452" fill="none" stroke="#6b6f7b" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="480" y="470" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">Because the app runs the exact code that was</text>
<text x="480" y="488" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">tested, the 98% accuracy is about the real app,</text>
<text x="480" y="506" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">not a different version of it.</text>
</svg>