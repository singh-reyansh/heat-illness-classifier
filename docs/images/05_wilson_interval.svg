<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<title>Wilson confidence interval</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#6b6f7b"/></marker></defs>
<rect width="880" height="430" fill="#ffffff"/>
<text x="30" y="36" font-size="19" fill="#10151f" font-weight="bold" text-anchor="start">Wilson confidence interval: how sure can we be about the accuracy?</text>
<text x="30" y="58" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start">50 test cases is a small sample. The range shows where the TRUE accuracy probably is (95% confidence).</text>
<line x1="230.0" y1="85" x2="230.0" y2="290" stroke="#eceef3" stroke-width="1"/>
<text x="230.0" y="308" font-size="12" fill="#8b8f9b" font-weight="normal" text-anchor="middle">0%</text>
<line x1="352.0" y1="85" x2="352.0" y2="290" stroke="#eceef3" stroke-width="1"/>
<text x="352.0" y="308" font-size="12" fill="#8b8f9b" font-weight="normal" text-anchor="middle">20%</text>
<line x1="474.0" y1="85" x2="474.0" y2="290" stroke="#eceef3" stroke-width="1"/>
<text x="474.0" y="308" font-size="12" fill="#8b8f9b" font-weight="normal" text-anchor="middle">40%</text>
<line x1="596.0" y1="85" x2="596.0" y2="290" stroke="#eceef3" stroke-width="1"/>
<text x="596.0" y="308" font-size="12" fill="#8b8f9b" font-weight="normal" text-anchor="middle">60%</text>
<line x1="718.0" y1="85" x2="718.0" y2="290" stroke="#eceef3" stroke-width="1"/>
<text x="718.0" y="308" font-size="12" fill="#8b8f9b" font-weight="normal" text-anchor="middle">80%</text>
<line x1="840.0" y1="85" x2="840.0" y2="290" stroke="#eceef3" stroke-width="1"/>
<text x="840.0" y="308" font-size="12" fill="#8b8f9b" font-weight="normal" text-anchor="middle">100%</text>
<text x="215" y="125" font-size="13.5" fill="#10151f" font-weight="bold" text-anchor="end">Temperature only</text>
<line x1="442.28" y1="120" x2="605.15" y2="120" stroke="#9a9a94" stroke-width="8"/>
<circle cx="522.8" cy="120" r="8" fill="#ffffff" stroke="#3a3a37" stroke-width="3"/>
<text x="522.8" y="104" font-size="12.5" fill="#3a3a37" font-weight="bold" text-anchor="middle">48%</text>
<text x="442.28" y="144" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="middle">34.8</text>
<text x="605.15" y="144" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="middle">61.5</text>
<text x="215" y="195" font-size="13.5" fill="#10151f" font-weight="bold" text-anchor="end">Keyword search</text>
<line x1="625.28" y1="190" x2="761.92" y2="190" stroke="#2a78d6" stroke-width="8"/>
<circle cx="705.8" cy="190" r="8" fill="#ffffff" stroke="#123f75" stroke-width="3"/>
<text x="705.8" y="174" font-size="12.5" fill="#123f75" font-weight="bold" text-anchor="middle">78%</text>
<text x="625.28" y="214" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="middle">64.8</text>
<text x="761.92" y="214" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="middle">87.2</text>
<text x="215" y="265" font-size="13.5" fill="#10151f" font-weight="bold" text-anchor="end">AI pipeline</text>
<line x1="775.95" y1="260" x2="837.56" y2="260" stroke="#eb6834" stroke-width="8"/>
<circle cx="827.8" cy="260" r="8" fill="#ffffff" stroke="#7a2e10" stroke-width="3"/>
<text x="827.8" y="244" font-size="12.5" fill="#7a2e10" font-weight="bold" text-anchor="middle">98%</text>
<text x="775.95" y="284" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="middle">89.5</text>
<text x="837.56" y="284" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="middle">99.6</text>
<text x="30" y="340" font-size="12.5" fill="#10151f" font-weight="normal" text-anchor="start">Dot = measured accuracy.  Bar = 95% Wilson range.  The bars do not overlap, so the AI is clearly better than both baselines.</text>
<text x="30" y="365" font-size="12.5" fill="#7a1515" font-weight="normal" text-anchor="start">Why Wilson? The simple method (accuracy ± margin) gives 98% ± 3.9% = 94.1% to 101.9%, which goes over 100%: impossible.</text>
<text x="30" y="385" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start">Wilson&#x27;s formula pulls the range back toward 50% a little, so it always stays between 0% and 100%, even with small samples.</text>
</svg>